name: Publish ORFix Repair v4.1.2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v4.1.2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test bilingual path preservation
        run: node frontend/tests/language.test.cjs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Test repair engine
        run: go test -count=1 ./engine

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails v2.17.1
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build native Windows x64 EXE
        shell: pwsh
        run: |
          $wails = Join-Path ((go env GOPATH).Trim()) 'bin/wails.exe'
          & $wails build -platform windows/amd64 -s -clean
          if ($LASTEXITCODE -ne 0) { throw 'Wails build failed' }
          $exe = 'build/bin/ORFixRepair_v4_1_2.exe'
          if (!(Test-Path $exe)) { throw "EXE missing: $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  ORFixRepair_v4_1_2.exe" | Set-Content -Path 'build/bin/ORFixRepair_v4_1_2.exe.sha256' -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Publish V4.1.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'build/bin/ORFixRepair_v4_1_2.exe'
          $checksum = 'build/bin/ORFixRepair_v4_1_2.exe.sha256'
          gh release view v4.1.2 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v4.1.2 already exists; refusing to overwrite' }
          $notes = @"
          ORFix Repair v4.1.2 — folder path preservation hotfix.

          Fix:
          - Preserve selected Windows drive paths, UNC paths, POSIX absolute paths and relative paths verbatim in English mode.
          - Chinese characters in folder names are no longer mistaken for untranslated diagnostic text.
          - The Chinese / English UI, V4.1.1 layout and repair engine remain unchanged.

          Validation:
          - Node.js regression test for CJK folder paths and translated UI labels.
          - Go repair engine tests.

          Requirements:
          - Windows 10/11 x64 and Microsoft WebView2 Runtime.
          - ORFix.ini / TexFx remain external game-side dependencies where applicable.
          - Review Face Fix warnings in-game before continuing.

          SHA-256: $((Get-Content $checksum).Split(' ')[0])
          "@
          gh release create v4.1.2 $exe $checksum --target $env:GITHUB_SHA --title 'ORFix Repair v4.1.2' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
