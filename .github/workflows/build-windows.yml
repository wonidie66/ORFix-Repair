name: Build ORFix Repair Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/dist/**'
      - 'build/windows/**'
      - 'wails.json'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bilingual path preservation
        run: node frontend/tests/language.test.cjs
      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Engine tests
        run: go test -count=1 ./engine
      - name: Download Wails dependencies
        run: go mod download
      - name: Install Wails v2.17.1
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build native EXE
        shell: pwsh
        run: |
          $wails = Join-Path ((go env GOPATH).Trim()) 'bin/wails.exe'
          & $wails build -platform windows/amd64 -s -clean
          if ($LASTEXITCODE -ne 0) { throw 'Wails build failed' }
          if (!(Test-Path 'build/bin/ORFixRepair_v4_1_2.exe')) { throw 'EXE missing' }
          Get-FileHash -Algorithm SHA256 'build/bin/ORFixRepair_v4_1_2.exe'
      - name: Package versioned source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build/source' | Out-Null
          git archive --format=zip --output='build/source/ORFixRepair_V4.1.2_Source.zip' HEAD
          if (!(Test-Path 'build/source/ORFixRepair_V4.1.2_Source.zip')) { throw 'Source archive missing' }
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ORFixRepair_V4.1.2_Source
          path: build/source/ORFixRepair_V4.1.2_Source.zip
          if-no-files-found: error
      - name: Upload real native EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORFixRepair_v4_1_2_Wails_Windows_x64
          path: build/bin/ORFixRepair_v4_1_2.exe
          if-no-files-found: error
