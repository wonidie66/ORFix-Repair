name: Import ORFix Repair v4.2.0 source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-v4.2.0-bootstrap.yml'

permissions:
  contents: write

jobs:
  import-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Download and import V4.2.0 source
        shell: pwsh
        env:
          SOURCE_ZIP_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-be88-8207-acd3-b89592d1de82/raw?se=2026-11-23T19%3A18%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=e78635a0-a6b1-5e8e-9965-62e571c95a74&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T02%3A34%3A23Z&ske=2026-11-24T02%3A34%3A23Z&sks=b&skv=2026-06-06&sig=yoKKIYAw8xnV%2BR5ccZW6ghC72gveyL/WtvRMnAM2GKI%3D'
        run: |
          $sourceZip = Join-Path $env:RUNNER_TEMP 'ORFixRepair_V4.2.0_Generic_Source.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'orfix-v4.2.0-source'
          Invoke-WebRequest -Uri $env:SOURCE_ZIP_URL -OutFile $sourceZip
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $extractDir -Force
          $sourceRoot = Join-Path $extractDir 'ORFixRepair_V4.2.0'
          if (!(Test-Path -LiteralPath $sourceRoot)) { throw 'V4.2.0 source root not found in archive.' }
          robocopy $sourceRoot $env:GITHUB_WORKSPACE /MIR /XD (Join-Path $env:GITHUB_WORKSPACE '.git') (Join-Path $sourceRoot '.github')
          if ($LASTEXITCODE -ge 8) { throw "Source import failed; robocopy exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Update public README and version notes
        shell: pwsh
        run: |
          @'
          # ORFix Repair v4.2.0 — Bilingual Windows build

          An open-source local Windows utility for selected GIMI / XXMI Mod compatibility repairs.

          ## Download v4.2.0

          - **[Windows x64 EXE](https://github.com/wonidie66/ORFix-Repair/releases/download/v4.2.0/ORFixRepair_v4_2_0.exe)**
          - [Release notes](https://github.com/wonidie66/ORFix-Repair/releases/tag/v4.2.0)
          - SHA-256: `84b13d2a1e21299afb7ff4d255a4a203e6d628caa9fc19176bc2e445de9e8988`

          ## What's new in v4.2.0

          - Adds a generic, signature-based four-slot material recognition and NNFix rule for the verified Diffuse / LightMap / MetalMap / ShadowRamp layout.
          - The rule is independent of character names, IB hashes and first-index values; unsupported or incomplete layouts are skipped for manual review.
          - Existing ORFix / NNFix, TexFx, Ningguang legacy migration, backup, rollback, Face Fix and bilingual UI workflows are retained.

          ## Requirements

          - Windows 10/11 x64 and Microsoft WebView2 Runtime.
          - Go 1.26+ and Wails v2.17.1 to build from source.
          - External [ORFix.ini](https://github.com/leotorrez/LeoTools/blob/main/releases/ORFix.ini) for ORFix / NNFix commands to work in-game.
          - TexFx-equipped Mods may require [TexFx](https://github.com/SinsOfSeven/TexFx).

          ## How to use

          1. Select a Mod directory or Mods root.
          2. Optionally run Preview (no modifications).
          3. Run Normal Repair. Backups are created for modified files.
          4. Review any Face Fix warning in-game before continuing.
          5. Test in-game and use Rollback if needed.

          ## Source

          The source code and regression tests are included in this repository. See `V4.2.0_变更说明.md` and `THIRD_PARTY_NOTICES.md`.
          '@ | Set-Content -LiteralPath README.md -Encoding utf8

          @'
          # ORFix Repair V4.2.0｜通用四槽位材质修复规则

          ## 发布状态
          V4.2.0 已完成 Windows x64 本地构建与用户验收，并正式发布。

          ## 新增规则
          对同一连续材质绑定组中的 `ps-t0=Diffuse`、`ps-t1=LightMap`、`ps-t2=MetalMap`、`ps-t3=ShadowRamp` 结构进行通用识别。规则不依赖角色名称、IB Hash 或 match_first_index。只有资源定义、资源命名关联、变体及对应文件完整性均通过检查时，才在绘制前插入既有 NNFix 命令。

          ## 安全边界
          - 不将任意四槽位材质一律判定为 NNFix。
          - 不接受缺失、重复、额外、类型不符或资源不完整的槽位组合。
          - 不修改 DDS、IB、BUF、贴图引用或 Face Fix 数据。
          - 未知结构继续跳过并提示人工检查。

          ## 保留功能
          原有 ORFix / NNFix、TexFx、凝光历史迁移、备份、回滚、Face Fix、中英文界面及工作流程保留。

          ## Windows EXE
          文件名：ORFixRepair_v4_2_0.exe
          SHA-256：84b13d2a1e21299afb7ff4d255a4a203e6d628caa9fc19176bc2e445de9e8988
          '@ | Set-Content -LiteralPath 'V4.2.0_变更说明.md' -Encoding utf8

      - name: Run regression tests
        shell: pwsh
        run: |
          node frontend/tests/language.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed.' }
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go module download failed.' }
          go test -count=1 ./engine
          if ($LASTEXITCODE -ne 0) { throw 'Go engine tests failed.' }
          go vet ./engine
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed.' }

      - name: Download and verify user-tested Windows EXE
        shell: pwsh
        env:
          EXE_DOWNLOAD_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-67c8-8211-a6c9-f351038e2a06/raw?se=2026-11-23T19%3A18%3A09Z&sp=r&sv=2026-06-06&sr=b&scid=436baafe-0a2c-5314-a7b1-54f07dd451e2&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T23%3A53%3A27Z&ske=2026-11-23T23%3A53%3A27Z&sks=b&skv=2026-06-06&sig=9Qu88wRWeeR/vrOstfpzwbNnJDW1GQ%2B3OTlaRb3CLK0%3D'
          EXPECTED_SHA256: '84b13d2a1e21299afb7ff4d255a4a203e6d628caa9fc19176bc2e445de9e8988'
        run: |
          $exe = 'build/bin/ORFixRepair_v4_2_0.exe'
          New-Item -ItemType Directory -Force -Path 'build/bin' | Out-Null
          Invoke-WebRequest -Uri $env:EXE_DOWNLOAD_URL -OutFile $exe
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "EXE SHA-256 mismatch. Expected $env:EXPECTED_SHA256, got $actual"
          }
          "$actual  ORFixRepair_v4_2_0.exe" | Set-Content -LiteralPath 'build/bin/ORFixRepair_v4_2_0.exe.sha256' -Encoding ascii
          Write-Host "Verified user-tested EXE: $actual"

      - name: Commit clean V4.2.0 source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: ORFix Repair v4.2.0'
          if ($LASTEXITCODE -ne 0) { throw 'Git commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Git push failed.' }

