name: Publish ORFix Repair v4.1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4.1.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Validate repair engine
        run: go test -count=1 ./engine
      - name: Download dependencies
        run: go mod download
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build Windows desktop executable
        shell: pwsh
        run: |
          $wails = Join-Path ((go env GOPATH).Trim()) 'bin/wails.exe'
          & $wails build -platform windows/amd64 -s -clean
          if ($LASTEXITCODE -ne 0) { throw 'Wails build failed' }
          if (!(Test-Path 'build/bin/ORFixRepair_v4_1_1.exe')) { throw 'EXE missing' }
          Get-FileHash -Algorithm SHA256 'build/bin/ORFixRepair_v4_1_1.exe'
      - name: Publish official v4.1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'build/bin/ORFixRepair_v4_1_1.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $notes = @"
          ORFix Repair v4.1.1 — Chinese / English language switch.

          Changes:
          - Language selector in the original top-right header.
          - English/Chinese interface, statuses, dialogs and on-screen diagnostics.
          - Same V4.1.0 repair engine and layout; no new automatic repair rules.

          Notes:
          - ORFix.ini is required for ORFix/NNFix operations to work in game.
          - WebView2 Runtime is required on Windows.
          - Inspect face warnings in-game before the optional Face Fix.

          SHA-256 (Windows EXE): $hash
          "@
          gh release view v4.1.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release v4.1.1 already exists; refusing to overwrite'
          }
          gh release create v4.1.1 $exe --target $env:GITHUB_SHA --title 'ORFix Repair v4.1.1' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
